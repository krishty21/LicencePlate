version: "3.8"

services:
  anpr-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: anpr-india:latest
    container_name: anpr-api
    ports:
      - "8000:8000"
    volumes:
      - ../weights:/app/weights:ro
      - ../data:/app/data:ro
    environment:
      - ANPR_CONFIG=/app/configs/serve.yaml
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis for async video job queue (production)
  # anpr-redis:
  #   image: redis:7-alpine
  #   container_name: anpr-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped
