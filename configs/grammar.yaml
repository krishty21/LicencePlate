# Grammar & post-processing configuration — v1.1 corrected regexes.
# See REVIEW_AND_RECOMMENDATIONS.md §4 for the bug fixes (BH series was wrong).

# Charset for series letters — A-Z minus {I, O, Q}.
# Confirmed against real Indian plates (Wikipedia + RTO practice).
series_letters: "ABCDEFGHJKLMNPRSTUVWXYZ"

# 38 state/UT 2-letter codes (verified via vehicleinfo.io, 1276 RTO codes total)
# OR is included as a legacy alias for OD (Odisha) — pre-2010 plates.
state_codes:
  - AN   # Andaman and Nicobar Islands
  - AP   # Andhra Pradesh
  - AR   # Arunachal Pradesh
  - AS   # Assam
  - BR   # Bihar
  - CH   # Chandigarh
  - CG   # Chhattisgarh
  - DD   # Dadra and Nagar Haveli and Daman and Diu
  - DL   # Delhi
  - GA   # Goa
  - GJ   # Gujarat
  - HR   # Haryana
  - HP   # Himachal Pradesh
  - JK   # Jammu and Kashmir
  - JH   # Jharkhand
  - KA   # Karnataka
  - KL   # Kerala
  - LA   # Ladakh
  - LD   # Lakshadweep
  - MP   # Madhya Pradesh
  - MH   # Maharashtra
  - MN   # Manipur
  - ML   # Meghalaya
  - MZ   # Mizoram
  - NL   # Nagaland
  - OD   # Odisha
  - PY   # Puducherry
  - PB   # Punjab
  - RJ   # Rajasthan
  - SK   # Sikkim
  - TN   # Tamil Nadu
  - TS   # Telangana
  - TR   # Tripura
  - UP   # Uttar Pradesh
  - UK   # Uttarakhand
  - WB   # West Bengal
  - OR   # LEGACY alias for OD (Odisha, pre-2010)

# Grammar regexes — v1.1 corrected.
# IMPORTANT: grammar match is a FEATURE, not a filter. Never hard-drop reads.
regexes:
  # Standard private/commercial: SS RR LLL NNNN
  private:
    pattern: '^[A-Z]{2}\d{1,2}[ABCDEFGHJKLMNPRSTUVWXYZ]{1,3}\d{4}$'
    example: MH12DE1434
    description: Standard private/commercial format (Motor Vehicles Act 1988)

  # Bharat series — FIXED in v1.1 (was ^BH\d{4}$, which is wrong)
  # Real format: YY BH NNNN LL (e.g. 22BH1234PA, since Aug 2021)
  bh:
    pattern: '^\d{2}BH\d{4}[ABCDEFGHJKLMNPRSTUVWXYZ]{1,2}$'
    example: 22BH1234PA
    description: Bharat series — pan-India registration (since 26 Aug 2021)

  # Vintage series — NEW in v1.1
  va:
    pattern: '^[A-Z]{2}VA[ABCDEFGHJKLMNPRSTUVWXYZ]{2}\d{4}$'
    example: MHVAAA1234
    description: Vintage series (since 15 Jul 2021)

  # Diplomatic — NEW in v1.1
  diplomatic:
    pattern: '^\d{1,3}(CD|CC|UN|IOD)\d{1,4}$'
    example: 199CD99
    description: Diplomatic missions (CD=embassy, CC=consulate, UN=UN, IOD=intl org)

  # Temporary — NEW in v1.1
  temporary:
    pattern: '^T\d{4}[A-Z]{2}\d{4}[A-Z]?$'
    example: T0124AN0123A
    description: Temporary registration (red on yellow)

  # Trade — NEW in v1.1
  trade:
    pattern: '^[A-Z]{2}\d{2}C\d{4}TC\d{4}$'
    example: AN01C0123TC0123
    description: Trade plate (manufacturers/dealers, white on red)

  # Defense — NEW in v1.1 (without the broad-arrow prefix)
  defense:
    pattern: '^\d{2}[A-Z]\d{6}[A-Z]$'
    example: 22B123456A
    description: Indian Armed Forces (broad arrow prefix omitted)

# State-code correction
correction:
  # Apply Levenshtein-1 correction to the first 2 chars (state code only)
  # ONLY if the rest of the plate looks like a valid private/BH/VA format.
  # Never correct series letters or 4-digit serials — they're arbitrary.
  enabled: true
  max_levenshtein: 1
  apply_to: state_code_only   # never series_letters or serial

# Color preprocessing — per-plate-class contrast normalization
color_aware_preprocessing:
  enabled: true
  # Commercial EV (yellow on green) is the lowest-contrast case.
  # Apply per-channel CLAHE before sending to recognizer.
  per_class_clahe:
    private_black_on_white: { clip: 1.5, tile: 4 }
    private_ev_white_on_green: { clip: 2.5, tile: 4 }
    commercial_black_on_yellow: { clip: 2.0, tile: 4 }
    commercial_ev_yellow_on_green: { clip: 3.0, tile: 4 }   # lowest contrast
    rental_yellow_on_black: { clip: 2.0, tile: 4 }
    defense_white_on_black: { clip: 1.5, tile: 4 }
    diplomatic_white_on_blue: { clip: 2.0, tile: 4 }
    temporary_red_on_yellow: { clip: 2.0, tile: 4 }
    trade_white_on_red: { clip: 2.0, tile: 4 }
