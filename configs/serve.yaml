# Serving configuration — FastAPI + ONNX Runtime.
# See IMPLEMENTATION_SPEC.md §4.

# Pipeline config — sibling YAML used to construct the Pipeline.
# On Kaggle, set to /kaggle/input/<dataset>/configs/serve.yaml
pipeline_config: configs/serve.yaml

device: cuda:0

# Inference backend
onnx:
  execution_provider: tensorrt   # tensorrt | cuda | cpu
  intra_op: 4
  inter_op: 1
  fp16: true

# Rate limiting — token bucket per-process
rate_limit_rps: 10
rate_limit_burst: 20

# Limits — IMPLEMENTATION_SPEC.md §4
max_image_mb: 10
max_video_mb: 200
max_video_minutes: 2

# Server
host: 0.0.0.0
port: 8000
workers: 1                       # ONNX models are not fork-safe; use 1 worker

# Async video jobs — in-memory dict for demo; use Redis/Celery in production.
jobs:
  backend: memory                # memory | redis
  ttl_seconds: 3600

# Metrics — Prometheus exposition at /metrics
metrics:
  enabled: true
  latency_histogram_buckets: [5, 10, 20, 50, 100, 200, 500, 1000, 2000]
